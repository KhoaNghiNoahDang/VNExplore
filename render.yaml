# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: vnexplore-api
    runtime: node
    region: singapore
    plan: free
    rootDir: Backend
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript, which the build needs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://ywsqmfxyrnfswxgvhsuv.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Language model for /v1/understand (optional — without keys the app uses its rule-based parser).
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
